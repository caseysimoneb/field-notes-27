<script>
(async function () {
  var ITER = 300000;
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg'); msg.textContent = 'Opening…';
    try {
      var raw = Uint8Array.from(atob(document.getElementById('data').textContent.trim()), function (c) { return c.charCodeAt(0); });
      var salt = raw.slice(8, 16), ct = raw.slice(16);
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits']);
      var bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256'}, base, 384));
      var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, ct);
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (err) { msg.textContent = 'That password didn’t open it.'; }
  });
})();
</script></body></html>
